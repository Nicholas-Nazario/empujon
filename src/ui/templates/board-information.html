<div class="board-heading" aria-label="Game information">
  <div class="information-heading">
    <span class="information-title"><span class="live-dot" aria-hidden="true"></span><span id="turn-title"></span></span>
    <div class="information-game-actions"><span class="move-count" id="move-count"></span>
    <span id="review-position" role="status" aria-live="polite" aria-atomic="true" hidden></span>
    <button class="information-game-button" id="undo" type="button" aria-label="Undo move" title="Undo move"><span data-icon="undo"></span></button>
    </div>
  </div>
  <div class="information-details">
    <p id="movement-description" class="movement-description" role="status"></p>
    <p id="movement-preview" class="movement-description" role="status" hidden></p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>
  <div class="information-actions">
    <button class="primary-button" data-confirm-upgrade hidden disabled>Upgrade 3</button>
    <button class="secondary-button" id="preview-place" hidden>Place here</button>
    <section id="game-review" class="game-review" aria-label="Game review" hidden>
      <div class="review-controls" role="group" aria-label="Review navigation">
        <button type="button" data-review="first" aria-label="Starting position" title="Starting position"><span data-icon="skip-back"></span></button>
        <button type="button" data-review="previous" aria-label="Previous position" title="Previous position"><span data-icon="caret-left"></span></button>
        <button type="button" data-review="next" aria-label="Next position" title="Next position"><span data-icon="caret-right"></span></button>
        <button type="button" data-review="final" aria-label="Final position" title="Final position"><span data-icon="skip-forward"></span></button>
      </div>
    </section>
  </div>
</div>
