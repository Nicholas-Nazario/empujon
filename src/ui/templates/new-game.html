<dialog id="new-game" aria-labelledby="new-game-title" aria-describedby="new-game-description">
  <p class="eyebrow">A FRESH START</p>
  <h2 id="new-game-title">Start a new game?</h2>
  <p id="new-game-description">Your current board will be cleared.</p>
  <div class="dialog-actions">
    <button class="secondary-button" id="cancel-new">Keep playing</button>
    <button class="primary-button" id="confirm-new">Start game</button>
  </div>
</dialog>
