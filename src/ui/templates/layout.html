<header class="topbar">
  <a class="wordmark" href="./" aria-label="Empujón home">
    <span class="brand-island" aria-hidden="true"><span data-icon="island"></span></span>
    <span>empuj<span class="accent-letter">o<span class="wordmark-accent" aria-hidden="true">´</span></span>n</span>
    <span class="brand-dot"></span>
  </a>
  <div class="header-actions">
    <button id="music-open" class="header-icon" type="button" popovertarget="music-dialog" aria-label="Music settings" aria-expanded="false" aria-controls="music-dialog"><span data-icon="music"></span></button>
    <button id="theme" type="button" role="switch" aria-label="Dark mode" aria-checked="false"><span data-icon="sun"></span></button>
    <button class="text-button" id="rules-open" aria-label="How to play">
      <span class="rules-label">How to play</span>
      <span data-icon="info"></span>
    </button>
  </div>
</header>
<div id="music-announcement" popover="manual" role="status" aria-live="polite" aria-atomic="true">
  <span class="music-announcement-label">NOW PLAYING</span>
  <strong id="music-announcement-title"></strong>
  <span id="music-announcement-composer"></span>
</div>
<main>
  <section id="online-banner" class="online-banner" aria-label="Online game" hidden>
    <div class="online-identity">
      <span class="online-badge"><span data-icon="online"></span> ONLINE GAME</span>
      <span id="online-seat"></span>
    </div>
    <p id="online-status" class="sr-only" role="status" aria-live="polite"></p>
  </section>
  <div class="game-layout">
    <aside class="setup-panel">
      <details class="game-settings" open>
        <summary><span>Game settings</span><span id="settings-summary">Classic · Pass &amp; play</span></summary>
        <div class="settings-content">
      <p class="eyebrow">MAKE IT YOUR GAME</p>
      <h2>Choose your rules.</h2>
      <div class="mode-picker" role="group" aria-label="Game rules">
        <button class="mode active" data-mode="classic">
          <span class="mode-heading">
            Classic
            <span class="mode-icon"><span data-icon="classic"></span></span>
          </span>
          <span>Get three in a row or all eight pieces on the board.</span>
        </button>
        <button class="mode" data-mode="upgrade">
          <span class="mode-heading">
            Upgrade
            <span class="mode-icon"><span data-icon="upgrade"></span></span>
          </span>
          <span>Make lines to upgrade your pieces. Get three upgraded pieces in a row to win.</span>
        </button>
      </div>
      <div class="opponent-picker" role="group" aria-label="Who’s across the board?">
        <span class="tiny-label">WHO’S ACROSS THE BOARD?</span>
        <button class="mode active" data-opponent="local" aria-pressed="true">Pass &amp; play</button>
        <button class="mode" data-opponent="beginner" aria-pressed="false">Beginner · CPU <span data-icon="robot"></span></button>
        <button class="mode" data-opponent="intermediate" aria-pressed="false">Intermediate · CPU <span data-icon="robot-duotone"></span></button>
        <button class="mode" data-opponent="advanced" aria-pressed="false">Advanced · CPU <span data-icon="robot-fill"></span></button>
        <button class="mode" id="host-online">Invite a friend <span data-icon="invite"></span></button>
        <p id="opponent-note"></p>
      </div>
      <div class="goal-card">
        <span class="tiny-label">YOUR WAY TO WIN</span>
        <p id="goal"></p>
        <div class="mini-line" aria-hidden="true">
          <span>3 in a row</span>
        </div>
      </div>
      <div id="online-details" hidden>
        <section class="session-section" aria-labelledby="online-rules-label">
          <p class="eyebrow" id="online-rules-label">GAME RULES</p>
          <h2 id="online-rules"></h2>
          <p id="online-settings"></p>
        </section>
        <section class="session-section invite-section" aria-labelledby="invite-label">
          <p class="eyebrow" id="invite-label">INVITE A FRIEND</p>
          <label class="sr-only" for="sidebar-invite-url">Game invite link</label>
          <input id="sidebar-invite-url" class="invite-preview" readonly>
          <button class="copy-button" id="show-invite">
            <span data-icon="copy"></span>
            <span>Copy invite link</span>
          </button>
          <p id="sidebar-copy-feedback" class="copy-feedback" role="status" aria-live="polite"></p>
        </section>
        <section class="session-section" aria-labelledby="session-label">
          <p class="eyebrow" id="session-label">SESSION</p>
          <dl class="session-meta"><div><dt>Game code</dt><dd id="online-code"></dd></div></dl>
          <p id="online-clock" aria-live="off"></p>
          <button class="danger-button" id="leave-online" hidden>Leave online game</button>
        </section>
      </div>
        </div>
      </details>
    </aside>
    <section class="play-panel" aria-label="Game board">
      <!-- board-information -->
      <div class="board-frame">
        <div class="coordinates top-coords" aria-hidden="true">
          <span>A</span>
          <span>B</span>
          <span>C</span>
          <span>D</span>
          <span>E</span>
          <span>F</span>
        </div>
        <div class="board-grid">
          <div class="row-coordinates" aria-hidden="true">
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
          </div>
          <div class="board" id="board" role="group" aria-label="Six by six game board"></div>
          <div id="movement-overlay" class="movement-overlay"></div>
        </div>
        <div class="board-caption">
          <span id="board-mode">CLASSIC</span>
        </div>
      </div>
      <div id="choices" class="choices"></div>
      <div class="board-actions">
        <button class="text-button" id="undo">
          <span data-icon="undo"></span>
          <span>Undo move</span>
        </button>
        <button class="text-button" id="sound" aria-pressed="false">
          <span data-icon="music-off"></span>
          <span>Sound off</span>
        </button>
        <button class="text-button" id="movement-toggle" aria-pressed="false" title="Toggle movement annotations"><span data-icon="eye-off"></span><span>Annotations off</span></button>
        <button class="text-button" id="restart">
          <span data-icon="restart"></span>
          <span>New game</span>
        </button>
      </div>
      <button class="text-button touch-preview-setting" id="touch-preview" aria-pressed="false"><span data-icon="touch-off"></span><span>Touch preview off</span></button>
    </section>
    <aside class="players-panel" aria-label="Players">
      <div id="players"></div>
    </aside>
  </div>
</main>
